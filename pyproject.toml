[project]
name = "osu_fusion"
version = "0.1.0"
authors = []
description = "WIP diffusion model for osu! beatmaps"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "accelerate>=1.13.0",
    "bezier>=2024.6.20",
    "bitsandbytes>=0.49.2",
    "diffusers>=0.37.1",
    "einops>=0.8.2",
    "gradio>=6.11.0",
    "h5py>=3.16.0",
    "librosa==0.11.0",
    "matplotlib>=3.10.8",
    "peft>=0.18.1",
    "resampy>=0.4.3",
    "rosu-pp-py>=3.1.0",
    "sanitize-filename>=1.2.0",
    "scipy>=1.17.1",
    "slider",
    "soundfile>=0.13.1",
    "torch>=2.10.0",
    "torchdiffeq>=0.2.5",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B", "N", "ANN", "COM", "C4", "EM", "SIM", "RUF", "C90"]
ignore = ["N803", "N806", "N812"]
task-tags = ["TODO", "FIXME"]


[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "nbformat>=5.10.4",
    "ninja>=1.13.0",
    "plotly>=6.6.0",
    "ruff>=0.15.9",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
slider = { git = "https://github.com/llllllllll/slider" }
