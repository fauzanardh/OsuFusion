[project]
name = "osu_fusion"
version = "0.1.0"
authors = []
description = "WIP diffusion model for osu! beatmaps"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "accelerate>=1.10.0",
    "bezier>=2024.6.20",
    "diffusers>=0.35.1",
    "einops>=0.8.1",
    "gradio>=5.43.1",
    "librosa==0.10.2.post1",
    "matplotlib>=3.10.5",
    "peft>=0.17.1",
    "resampy>=0.4.3",
    "rosu-pp-py>=3.1.0",
    "sanitize-filename>=1.2.0",
    "scipy>=1.16.1",
    "soundfile>=0.13.1",
    "torch>=2.7.0",
    "torchdiffeq>=0.2.5",
    "tqdm>=4.67.1",
    "wandb>=0.21.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
select = ["E", "W", "F", "B", "N", "ANN", "COM", "C4", "EM", "SIM", "RUF", "C90"]
ignore = ["N803", "N806", "N812"]
task-tags = ["TODO", "FIXME"]
line-length = 120

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "nbformat>=5.10.4",
    "ninja>=1.13.0",
    "plotly>=6.3.0",
    "ruff>=0.12.9",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
